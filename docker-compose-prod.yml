# Defines services, their images, and interactions between services.

volumes:
  antarctic_postgres_db_vol:
  antarctic_stored_data:
  antarctic_geoserver_data:

services:
  db_postgres:
    # Database to store all vector data, states, and links to raster data.
    image: postgis/postgis:16-3.4
    container_name: db_postgres_digital_twin
    restart: always
    volumes:
      - antarctic_postgres_db_vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB
    networks: [ data ]

  backend:
    # Performs analysis, computation, handles web requests, facilitates database interactions
    build:
      context: .
      dockerfile: docker/eddie.Dockerfile
    container_name: backend_digital_twin
    entrypoint: [ "src/backend_entrypoint.sh" ]
    env_file:
      - .env
      - api_keys.env
      - .env.docker-override
    volumes:
      - antarctic_stored_data:/stored_data
    healthcheck:
      test: curl --fail -s http://localhost:5000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - db_postgres
      - message_broker
      - geoserver
    environment:
      VIRTUAL_HOST: ${BACKEND_VIRTUAL_HOST}
      VIRTUAL_PORT: "5000"
      LETSENCRYPT_HOST: ${BACKEND_VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: gri-enquiries@canterbury.ac.nz
      # The core builds redis://<MESSAGE_BROKER_HOST>:6379/0, so the password rides in the host part
      MESSAGE_BROKER_HOST: ":${MESSAGE_BROKER_PASSWORD}@message_broker"
    restart: always
    networks: [ default, data, webproxy ]

  celery_worker:
    # Performs tasks such as complex computation asynchronously on behalf of backend
    build:
      context: .
      dockerfile: docker/eddie.Dockerfile
    container_name: celery_worker_digital_twin
    entrypoint: [ "src/celery_worker_entrypoint.sh" ]
    environment:
      MESSAGE_BROKER_HOST: ":${MESSAGE_BROKER_PASSWORD}@message_broker"
    restart: always
    env_file:
      - .env
      - api_keys.env
      - .env.docker-override
    volumes:
      # Bind host data directories to container, allowing different instances to share data sources.
      - antarctic_stored_data:/stored_data
      - antarctic_geoserver_data:/stored_data/geoserver
      # The sea ice model's files, dropped into ./sic_model by hand (see README). Read-only.
      - ./sic_model:/stored_data/sic_model:ro
    healthcheck:
      test: curl --fail -s http://localhost:5001/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - db_postgres
      - message_broker
      - geoserver
    networks: [ default, data ]

  geoserver:
    # Serves geospatial web data through interactions with files and database
    build:
      context: lib/eddie
      dockerfile: geoserver.Dockerfile
    container_name: geoserver_digital_twin
    volumes:
      - antarctic_geoserver_data:/opt/geoserver_data
    depends_on:
      - db_postgres
    environment:
      - SKIP_DEMO_DATA=true
      - CORS_ENABLED=true
      - ROOT_WEBAPP_REDIRECT=true
      - GEOSERVER_ADMIN_USER=$GEOSERVER_ADMIN_NAME
      - GEOSERVER_ADMIN_PASSWORD=$GEOSERVER_ADMIN_PASSWORD
      - PROXY_BASE_URL=${GEOSERVER_HOST}/geoserver
      - VIRTUAL_HOST=${GEOSERVER_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${GEOSERVER_VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=gri-enquiries@canterbury.ac.nz
      - JAVA_TOOL_OPTIONS=-XX:-UseBASE64Intrinsics
    restart: always
    networks: [ default, data, webproxy ]
    healthcheck:
      test: curl --fail -s http://localhost:8080/geoserver || exit 1
      timeout: 5s
      retries: 10

  terria_map:
    # Front-end using terria.js
    build:
      context: terriajs
    environment:
      - CESIUM_ACCESS_TOKEN=$CESIUM_ACCESS_TOKEN
      - BACKEND_HOST=$BACKEND_HOST
      - BACKEND_PORT=$BACKEND_PORT
      - VIRTUAL_HOST=${WWW_VIRTUAL_HOST}
      - VIRTUAL_PORT=3001
      - LETSENCRYPT_HOST=${WWW_VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=gri-enquiries@canterbury.ac.nz
    healthcheck:
      test: curl --fail -s http://localhost:3001/ || exit 1
      timeout: 5s
      retries: 10
    restart: always
    networks: [ webproxy ]

  message_broker:
    # Communicates between backend and workers to assign tasks and store state
    image: redis:7
    container_name: message_broker_digital_twin
    # Backend and worker reach it as MESSAGE_BROKER_HOST=:<MESSAGE_BROKER_PASSWORD>@message_broker (.env)
    command: redis-server --requirepass "${MESSAGE_BROKER_PASSWORD:?set MESSAGE_BROKER_PASSWORD in .env}"
    environment:
      REDISCLI_AUTH: ${MESSAGE_BROKER_PASSWORD}
    healthcheck:
      # redis-cli reads REDISCLI_AUTH; without it ping answers NOAUTH
      test: redis-cli ping | grep PONG
      timeout: 1s
      retries: 10
    restart: always
    networks: [ data ]

networks:
  # Postgres and Redis only: no egress, and nothing but the backend, worker and GeoServer can reach them
  data:
    internal: true
  webproxy:
    external: true
