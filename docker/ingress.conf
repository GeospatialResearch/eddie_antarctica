# Single entry point for the twin. nginx-proxy terminates TLS on the shared webproxy network and
# forwards the twin's one virtual host here; nothing else in the stack joins webproxy.
server {
    listen 80;
    listen [::]:80;
    # PyWPS maxrequestsize (src/pywps.cfg) and gunicorn's --timeout (src/backend_entrypoint.sh)
    client_max_body_size 3m;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location = /healthz { return 200; }

    location / { proxy_pass http://terria_map:3001; }

    # The backend serves its routes at the root; the trailing slash strips /api
    location /api/ { proxy_pass http://backend:5000/; }

    # GeoServer's admin UI and REST API stay internal: use an SSH tunnel to the container for them
    location ~ ^/geoserver/(web|rest|gwc/rest)(/|$) { return 404; }
    # Tomcat drops ;params before routing, so /geoserver/web;x/ would reach the admin UI past the rule above
    location ~ "^/geoserver/.*;" { return 404; }
    location /geoserver/ { proxy_pass http://geoserver:8080/geoserver/; }
}
